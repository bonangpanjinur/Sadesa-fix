name: Package Manager Consistency

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/**
      - scripts/validate-package-manager.py
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/**
      - scripts/validate-package-manager.py

permissions:
  contents: read

jobs:
  validate:
    name: Validate pnpm version alignment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate package manager alignment
        run: python3 scripts/validate-package-manager.py
