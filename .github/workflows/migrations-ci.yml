name: Migrations CI

on:
  push:
    paths:
      - "supabase/migrations_consolidated/**"
      - ".github/workflows/migrations-ci.yml"
  pull_request:
    paths:
      - "supabase/migrations_consolidated/**"
      - ".github/workflows/migrations-ci.yml"
  workflow_dispatch:

jobs:
  migrate:
    name: Apply consolidated migrations on clean Postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      MIG_DIR: supabase/migrations_consolidated

    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" && break
            sleep 1
          done

      - name: Bootstrap Supabase-like roles and schemas
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          -- Roles that Supabase migrations reference
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticator') THEN CREATE ROLE authenticator NOINHERIT LOGIN PASSWORD 'postgres'; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_admin') THEN CREATE ROLE supabase_admin SUPERUSER LOGIN PASSWORD 'postgres'; END IF;
          END $$;
          GRANT anon, authenticated, service_role TO authenticator;

          -- Schemas that migrations may reference
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE SCHEMA IF NOT EXISTS extensions;

          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

          -- Minimal auth.users stand-in so FKs resolve
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            email text,
            raw_user_meta_data jsonb DEFAULT '{}'::jsonb,
            created_at timestamptz DEFAULT now()
          );

          -- auth.uid()/auth.role() stubs
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS $$ SELECT COALESCE(current_setting('request.jwt.claim.role', true), 'anon') $$;

          -- Minimal storage schema stand-in
          CREATE TABLE IF NOT EXISTS storage.buckets (
            id text PRIMARY KEY,
            name text NOT NULL,
            public boolean DEFAULT false,
            created_at timestamptz DEFAULT now()
          );
          CREATE TABLE IF NOT EXISTS storage.objects (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            bucket_id text REFERENCES storage.buckets(id),
            name text,
            owner uuid,
            created_at timestamptz DEFAULT now(),
            metadata jsonb DEFAULT '{}'::jsonb
          );
          ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;
          SQL

      - name: Apply migrations sequentially (first pass — clean state)
        run: |
          set -euo pipefail
          for f in $(ls "$MIG_DIR"/*.sql | sort); do
            echo "::group::Apply $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done

      - name: Re-apply migrations (second pass — idempotency check)
        run: |
          set -euo pipefail
          for f in $(ls "$MIG_DIR"/*.sql | sort); do
            echo "::group::Re-apply $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done

      - name: Smoke check — required tables exist
        run: |
          psql -v ON_ERROR_STOP=1 -c "
            SELECT tablename FROM pg_tables
            WHERE schemaname='public'
              AND tablename IN ('profiles','user_roles','merchants','products','orders','notifications','app_settings')
            ORDER BY tablename;
          "

      - name: API smoke test — schema, grants, and RLS policies
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          -- ─── 1. Required public tables must exist ───────────────────────────
          DO $$
          DECLARE
            required text[] := ARRAY[
              'profiles','user_roles','merchants','products','orders','order_items',
              'notifications','app_settings','categories','villages','reviews',
              'chat_messages','saved_addresses','wishlists','vouchers','ride_requests'
            ];
            t text;
          BEGIN
            FOREACH t IN ARRAY required LOOP
              IF NOT EXISTS (SELECT 1 FROM pg_tables WHERE schemaname='public' AND tablename=t) THEN
                RAISE EXCEPTION 'Missing required table: public.%', t;
              END IF;
            END LOOP;
          END $$;

          -- ─── 2. Every public table must have Data-API GRANTs ────────────────
          DO $$
          DECLARE
            r record;
          BEGIN
            FOR r IN
              SELECT c.relname AS table_name
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
               WHERE c.relkind='r' AND n.nspname='public'
            LOOP
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.role_table_grants
                 WHERE table_schema='public' AND table_name=r.table_name
                   AND grantee='authenticated'
                   AND privilege_type IN ('SELECT','INSERT','UPDATE','DELETE')
              ) THEN
                RAISE EXCEPTION 'Table public.% is missing GRANTs to authenticated (Data API would 401)', r.table_name;
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM information_schema.role_table_grants
                 WHERE table_schema='public' AND table_name=r.table_name
                   AND grantee='service_role'
              ) THEN
                RAISE EXCEPTION 'Table public.% is missing GRANTs to service_role', r.table_name;
              END IF;
            END LOOP;
          END $$;

          -- ─── 3. Every public table must have RLS enabled ────────────────────
          DO $$
          DECLARE
            r record;
          BEGIN
            FOR r IN
              SELECT c.relname AS table_name
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
               WHERE c.relkind='r' AND n.nspname='public' AND NOT c.relrowsecurity
            LOOP
              RAISE EXCEPTION 'Table public.% does not have RLS enabled', r.table_name;
            END LOOP;
          END $$;

          -- ─── 4. Sensitive tables must have at least one policy ──────────────
          DO $$
          DECLARE
            sensitive text[] := ARRAY[
              'profiles','user_roles','orders','order_items','notifications',
              'chat_messages','saved_addresses','wishlists','ride_requests'
            ];
            t text;
            n int;
          BEGIN
            FOREACH t IN ARRAY sensitive LOOP
              SELECT count(*) INTO n FROM pg_policies WHERE schemaname='public' AND tablename=t;
              IF n = 0 THEN
                RAISE EXCEPTION 'Table public.% has RLS but no policies (all access blocked)', t;
              END IF;
            END LOOP;
          END $$;
          SQL

      - name: API smoke test — anon vs authenticated visibility (RLS behavior)
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          -- Seed a user + a couple of rows to exercise RLS
          DO $$
          DECLARE
            uid_a uuid := '11111111-1111-1111-1111-111111111111';
            uid_b uuid := '22222222-2222-2222-2222-222222222222';
          BEGIN
            INSERT INTO auth.users(id, email) VALUES (uid_a, 'a@test.local') ON CONFLICT DO NOTHING;
            INSERT INTO auth.users(id, email) VALUES (uid_b, 'b@test.local') ON CONFLICT DO NOTHING;
          END $$;

          -- Insert notifications as service_role (bypasses RLS) if the table shape allows it.
          -- Use a permissive insert via superuser; skip silently if columns differ.
          DO $$
          BEGIN
            BEGIN
              EXECUTE $q$INSERT INTO public.notifications(user_id, title, message)
                        VALUES ('11111111-1111-1111-1111-111111111111','ci','ci-a'),
                               ('22222222-2222-2222-2222-222222222222','ci','ci-b')
                        ON CONFLICT DO NOTHING$q$;
            EXCEPTION WHEN OTHERS THEN
              RAISE NOTICE 'Skipping notifications seed: %', SQLERRM;
            END;
          END $$;

          -- Impersonate user A via PostgREST-style GUCs, then check RLS filters rows.
          SET LOCAL role authenticated;
          SET LOCAL "request.jwt.claim.sub" = '11111111-1111-1111-1111-111111111111';
          SET LOCAL "request.jwt.claim.role" = 'authenticated';

          DO $$
          DECLARE
            visible int;
            total int;
          BEGIN
            SELECT count(*) INTO visible FROM public.notifications;
            -- As user A, must NOT see user B's row. Allow 0 if seed was skipped.
            IF visible > 1 THEN
              RAISE EXCEPTION 'RLS leak: authenticated user sees % notifications (expected 0 or 1)', visible;
            END IF;
          END $$;

          RESET role;

          -- Anonymous role must not see any auth-scoped rows.
          SET LOCAL role anon;
          SET LOCAL "request.jwt.claim.role" = 'anon';
          DO $$
          DECLARE
            visible int;
          BEGIN
            BEGIN
              SELECT count(*) INTO visible FROM public.notifications;
              IF visible > 0 THEN
                RAISE EXCEPTION 'RLS leak: anon sees % notifications (expected 0)', visible;
              END IF;
            EXCEPTION WHEN insufficient_privilege THEN
              -- Also acceptable: table not granted to anon at all.
              NULL;
            END;
          END $$;
          RESET role;
          SQL

      - name: API smoke test — UMKM order create/read RLS scenarios
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          -- ─── Seed: buyer A, buyer B, merchant owner M + a merchant row ──────
          DO $$
          DECLARE
            uid_a uuid := '11111111-1111-1111-1111-111111111111';
            uid_b uuid := '22222222-2222-2222-2222-222222222222';
            uid_m uuid := '33333333-3333-3333-3333-333333333333';
            mid   uuid := '44444444-4444-4444-4444-444444444444';
          BEGIN
            INSERT INTO auth.users(id, email) VALUES
              (uid_a, 'a@test.local'), (uid_b, 'b@test.local'), (uid_m, 'm@test.local')
            ON CONFLICT DO NOTHING;

            -- Minimal merchant row; tolerate schema drift by only using columns we know exist.
            BEGIN
              EXECUTE $q$INSERT INTO public.merchants(id, user_id, name)
                        VALUES ('44444444-4444-4444-4444-444444444444',
                                '33333333-3333-3333-3333-333333333333',
                                'CI Test Merchant')
                        ON CONFLICT (id) DO NOTHING$q$;
            EXCEPTION WHEN OTHERS THEN
              RAISE NOTICE 'Skipping merchant seed (schema drift): %', SQLERRM;
            END;
          END $$;

          -- ─── Scenario 1 (success): buyer A creates order, reads it back ────
          BEGIN;
            SET LOCAL role authenticated;
            SET LOCAL "request.jwt.claim.sub" = '11111111-1111-1111-1111-111111111111';
            SET LOCAL "request.jwt.claim.role" = 'authenticated';

            INSERT INTO public.orders(id, buyer_id, merchant_id, status, subtotal, total)
            VALUES ('55555555-5555-5555-5555-555555555501',
                    '11111111-1111-1111-1111-111111111111',
                    '44444444-4444-4444-4444-444444444444',
                    'NEW', 25000, 25000);

            DO $$
            DECLARE n int;
            BEGIN
              SELECT count(*) INTO n FROM public.orders
                WHERE id = '55555555-5555-5555-5555-555555555501';
              IF n <> 1 THEN
                RAISE EXCEPTION 'Scenario 1 FAILED: buyer cannot read own order (got % rows)', n;
              END IF;
            END $$;
          COMMIT;

          -- ─── Scenario 2 (fail): buyer B must NOT read buyer A's order ──────
          BEGIN;
            SET LOCAL role authenticated;
            SET LOCAL "request.jwt.claim.sub" = '22222222-2222-2222-2222-222222222222';
            SET LOCAL "request.jwt.claim.role" = 'authenticated';

            DO $$
            DECLARE n int;
            BEGIN
              SELECT count(*) INTO n FROM public.orders
                WHERE id = '55555555-5555-5555-5555-555555555501';
              IF n <> 0 THEN
                RAISE EXCEPTION 'RLS LEAK: buyer B sees buyer A order (got % rows)', n;
              END IF;
            END $$;
          COMMIT;

          -- ─── Scenario 3 (fail): buyer B cannot spoof buyer_id = A on INSERT ─
          BEGIN;
            SET LOCAL role authenticated;
            SET LOCAL "request.jwt.claim.sub" = '22222222-2222-2222-2222-222222222222';
            SET LOCAL "request.jwt.claim.role" = 'authenticated';

            DO $$
            BEGIN
              BEGIN
                INSERT INTO public.orders(id, buyer_id, merchant_id, status, subtotal, total)
                VALUES ('55555555-5555-5555-5555-555555555502',
                        '11111111-1111-1111-1111-111111111111',  -- spoofed buyer A
                        '44444444-4444-4444-4444-444444444444',
                        'NEW', 10000, 10000);
                RAISE EXCEPTION 'RLS BYPASS: buyer B was able to insert order as buyer A';
              EXCEPTION
                WHEN insufficient_privilege OR check_violation THEN
                  NULL;  -- expected: WITH CHECK / RLS blocks it
                WHEN OTHERS THEN
                  IF SQLSTATE = '42501' OR SQLERRM LIKE '%row-level security%' THEN
                    NULL;
                  ELSE
                    RAISE;
                  END IF;
              END;
            END $$;
          ROLLBACK;

          -- ─── Scenario 4 (fail): anon cannot insert or read orders ──────────
          BEGIN;
            SET LOCAL role anon;
            SET LOCAL "request.jwt.claim.role" = 'anon';

            DO $$
            BEGIN
              BEGIN
                INSERT INTO public.orders(id, buyer_id, merchant_id, status, subtotal, total)
                VALUES ('55555555-5555-5555-5555-555555555503',
                        '11111111-1111-1111-1111-111111111111',
                        '44444444-4444-4444-4444-444444444444',
                        'NEW', 5000, 5000);
                RAISE EXCEPTION 'RLS BYPASS: anon was able to insert into orders';
              EXCEPTION
                WHEN insufficient_privilege OR check_violation THEN NULL;
                WHEN OTHERS THEN
                  IF SQLSTATE = '42501' OR SQLERRM LIKE '%row-level security%' THEN
                    NULL;
                  ELSE
                    RAISE;
                  END IF;
              END;
            END $$;

            DO $$
            DECLARE n int;
            BEGIN
              BEGIN
                SELECT count(*) INTO n FROM public.orders;
                IF n > 0 THEN
                  RAISE EXCEPTION 'RLS LEAK: anon sees % orders (expected 0)', n;
                END IF;
              EXCEPTION WHEN insufficient_privilege THEN
                NULL;  -- also acceptable
              END;
            END $$;
          ROLLBACK;

          -- ─── Scenario 5 (success): merchant owner can read orders for its shop
          BEGIN;
            SET LOCAL role authenticated;
            SET LOCAL "request.jwt.claim.sub" = '33333333-3333-3333-3333-333333333333';
            SET LOCAL "request.jwt.claim.role" = 'authenticated';

            DO $$
            DECLARE n int;
            BEGIN
              SELECT count(*) INTO n FROM public.orders
                WHERE id = '55555555-5555-5555-5555-555555555501';
              IF n <> 1 THEN
                RAISE EXCEPTION 'Scenario 5 FAILED: merchant owner cannot read own shop order (got % rows)', n;
              END IF;
            END $$;
          COMMIT;

          -- ─── Cleanup ────────────────────────────────────────────────────────
          DELETE FROM public.orders WHERE id LIKE '55555555-5555-5555-5555-5555555555%';
          SQL


