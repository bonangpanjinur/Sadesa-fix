name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Non-secret placeholders for tests/build; real credentials are never committed.
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: Lint changed reliability surfaces
        run: >-
          pnpm exec eslint
          src/lib/observability.ts
          src/lib/observability.test.ts
          src/lib/pilotRollout.ts
          src/lib/pilotRollout.test.ts
          src/lib/pilotReadiness.ts
          src/lib/pilotReadiness.test.ts
          src/lib/phase8GoNoGo.ts
          src/lib/phase8GoNoGo.test.ts
          src/lib/phase9ScaleUp.ts
          src/lib/phase9ScaleUp.test.ts
          src/lib/chat/rollout.ts
          src/lib/chat/phase8Acceptance.test.ts
          src/hooks/usePOSOfflineSync.ts
          src/lib/posOfflineDB.ts
          src/pages/pos/POSKasirPage.tsx
          src/sw.ts
          --max-warnings=0

      - name: Unit tests
        run: pnpm test -- --run

      - name: Phase 8 acceptance matrix
        run: pnpm run test:chat:phase8 && pnpm exec vitest run src/lib/phase8GoNoGo.test.ts

      - name: Phase 9 scale-up gate
        run: pnpm exec vitest run src/lib/phase9ScaleUp.test.ts

      - name: Build
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Package manager consistency
        run: pnpm run validate:package-manager
